<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ELEKTRON Evidence Photosheet</title>
  <style>
    @page { size: A4; margin: 12mm; }
    body { font-family: "IBM Plex Sans", "Segoe UI", sans-serif; color: #0f172a; margin: 0; }
    h1 { font-size: 16px; margin: 0 0 4px; }
    .sub { font-size: 11px; color: #64748b; margin-bottom: 16px; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .cell { border: 1px solid #cbd5e1; overflow: hidden; }
    .cell img { width: 100%; height: 180px; object-fit: cover; display: block; background: #e2e8f0; }
    .cap { font-size: 10px; padding: 6px 8px; }
    .footer { margin-top: 16px; font-size: 9px; color: #94a3b8; }
  </style>
</head>
<body>
  <h1>Evidence Photosheet — {{vehicle.vin}}</h1>
  <div class="sub">{{report.id}} · {{report.timestamp}}</div>
  <div class="grid">
    {{#each inspection_photos}}
    <div class="cell">
      {{#if this.url}}
      <img src="{{this.url}}" alt="{{this.label}}" />
      {{else}}
      <div style="height:180px;display:flex;align-items:center;justify-content:center;color:#64748b;">No image URI</div>
      {{/if}}
      <div class="cap"><strong>{{this.label}}</strong><br/>{{this.timestamp}}</div>
    </div>
    {{/each}}
  </div>
  <div class="footer">source_hash={{report.source_hash}}</div>
</body>
</html>
